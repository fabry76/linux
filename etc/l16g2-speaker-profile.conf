context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "L16G2 Speaker Profile"
      media.name = "L16G2 Speaker Profile"

      filter.graph = {
        nodes = [
          {
            type = lv2
            name = eq
            plugin = "http://lsp-plug.in/plugins/lv2/para_equalizer_x8_stereo"

            control = {
              # Provide headroom for the bass boost
              "g_in" = 0.72

              # Stronger low-shelf boost in the usable speaker range
              "ft_0" = 3
              "f_0"  = 140.0
              "g_0"  = 2.20
              "q_0"  = 0.70

              # Add warmth and body without boosting very low frequencies
              "ft_1" = 1
              "f_1"  = 210.0
              "g_1"  = 1.35
              "q_1"  = 0.85

              # Reduce boxiness and hollow low-mid frequencies
              "ft_2" = 1
              "f_2"  = 420.0
              "g_2"  = 0.82
              "q_2"  = 1.00

              # Improve voice definition without increasing background hiss
              "ft_3" = 1
              "f_3"  = 1700.0
              "g_3"  = 1.15
              "q_3"  = 0.90

              # Gentle voice presence boost
              "ft_4" = 1
              "f_4"  = 2800.0
              "g_4"  = 1.12
              "q_4"  = 1.00

              # Reduce hiss and excessive brightness
              "ft_5" = 3
              "f_5"  = 6500.0
              "g_5"  = 0.82
              "q_5"  = 0.70
            }
          }
        ]
      }

      capture.props = {
        media.class = Audio/Sink
        node.name = "l16g2_profile_sink"
        audio.channels = 2
        audio.position = [ FL FR ]
        priority.session = 2000
      }

      playback.props = {
        node.name = "l16g2_profile_output"
        node.passive = true
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
]
