context.modules = [
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "L16G2 Equalized Speaker"
      media.name = "L16G2 Equalized Speaker"

      filter.graph = {
        nodes = [
          {
            type = lv2
            name = eq
            plugin = "http://lsp-plug.in/plugins/lv2/para_equalizer_x8_stereo"

            control = {
              # Reduced input gain to properly tame total output power
              "g_in" = 0.50

              # Main bass boost in the effective laptop speaker frequency range
              "ft_0" = 3
              "f_0"  = 150.0
              "g_0"  = 3.20
              "q_0"  = 0.75

              # Added warmth and lower-mid body
              "ft_1" = 1
              "f_1"  = 230.0
              "g_1"  = 1.80
              "q_1"  = 0.85

              # Reduce boxy and hollow resonances
              "ft_2" = 1
              "f_2"  = 420.0
              "g_2"  = 0.82
              "q_2"  = 1.00

              # Enhance vocal clarity and speech definition
              "ft_3" = 1
              "f_3"  = 1700.0
              "g_3"  = 1.15
              "q_3"  = 0.90

              # Gentle boost for speech presence
              "ft_4" = 1
              "f_4"  = 2800.0
              "g_4"  = 1.12
              "q_4"  = 1.00

              # Smooth out harsh high frequencies and reduce hiss
              "ft_5" = 3
              "f_5"  = 6500.0
              "g_5"  = 0.82
              "q_5"  = 0.70
            }
          }
        ]
      }

      capture.props = {
        media.class = Audio/Sink
        node.name = "l16g2_profile_sink"
        node.description = "L16G2 Equalized Speaker"
        audio.channels = 2
        audio.position = [ FL FR ]
        priority.session = 2000
        # Force default volume to 100% on startup
        node.volume = 1.0
      }

      playback.props = {
        node.name = "l16g2_profile_output"
        node.passive = true
        audio.channels = 2
        audio.position = [ FL FR ]
        node.volume = 1.0
      }
    }
  }
]
